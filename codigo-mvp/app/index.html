<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>JARVIS</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --border: #23272e;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #3ea6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #root { height: 100%; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [status, setStatus] = useState("conectando");
  const wsRef = useRef(null);
  const bottomRef = useRef(null);

  useEffect(() => {
    window.jarvisAPI.getHistory(30).then(setMessages);

    const ws = new WebSocket("ws://localhost:8000/ws");
    ws.onopen = () => setStatus("listo");
    ws.onclose = () => setStatus("desconectado");
    ws.onerror = () => setStatus("error de conexión");
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      setMessages((prev) => [...prev, { role: "assistant", content: data.reply }]);
      window.jarvisAPI.addMessage("assistant", data.reply);
    };
    wsRef.current = ws;
    return () => ws.close();
  }, []);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  function sendMessage() {
    const text = input.trim();
    if (!text || !wsRef.current || wsRef.current.readyState !== 1) return;
    const userMsg = { role: "user", content: text };
    setMessages((prev) => [...prev, userMsg]);
    window.jarvisAPI.addMessage("user", text);
    wsRef.current.send(JSON.stringify({ message: text, history: messages.slice(-10) }));
    setInput("");
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div style={{
        padding: "12px 20px", borderBottom: "1px solid var(--border)",
        display: "flex", justifyContent: "space-between", alignItems: "center"
      }}>
        <strong>JARVIS</strong>
        <span style={{ fontSize: 12, color: "var(--muted)" }}>{status}</span>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "20px" }}>
        {messages.map((m, i) => (
          <div key={i} style={{
            marginBottom: 14,
            display: "flex",
            justifyContent: m.role === "user" ? "flex-end" : "flex-start"
          }}>
            <div style={{
              maxWidth: "70%",
              padding: "10px 14px",
              borderRadius: 10,
              background: m.role === "user" ? "var(--accent)" : "var(--panel)",
              color: m.role === "user" ? "#0b0d10" : "var(--text)",
              border: m.role === "user" ? "none" : "1px solid var(--border)"
            }}>
              {m.content}
            </div>
          </div>
        ))}
        <div ref={bottomRef} />
      </div>

      <div style={{ padding: 16, borderTop: "1px solid var(--border)", display: "flex", gap: 10 }}>
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && sendMessage()}
          placeholder="Escribe algo a JARVIS..."
          style={{
            flex: 1, padding: "10px 14px", borderRadius: 8,
            border: "1px solid var(--border)", background: "var(--panel)",
            color: "var(--text)", outline: "none"
          }}
        />
        <button onClick={sendMessage} style={{
          padding: "10px 18px", borderRadius: 8, border: "none",
          background: "var(--accent)", color: "#0b0d10", fontWeight: 600, cursor: "pointer"
        }}>Enviar</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
