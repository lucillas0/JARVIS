# =============================================================================
#  JARVIS · servidor en Docker, para Synology / Xpenology
# =============================================================================
#  Si vienes de Container Manager y el proyecto no levantaba, los motivos
#  estaban en este fichero, y ya estan corregidos:
#
#   · No hay red propia. Docker Compose 5.1.0, el que lleva DSM 7.1 y 7.2, rompe
#     con "Container cannot be connected to network endpoints" en cualquier
#     daemon con API menor de 1.44 cuando el servicio declara `networks:`.
#     Sin declarar nada, el contenedor va a la red por defecto y se acabo.
#   · No hay `user:`. El contenedor arranca como root y ya baja a PUID/PGID solo
#     en el entrypoint, que ademas deja /app/brain/db escribible. Con `user:` el
#     entrypoint corria sin permisos y no podia arreglar nada.
#   · No hay `deploy.resources`. Fuera de Swarm lo ignora, y hay versiones de
#     Container Manager que se atascan al leerlo.
#   · Los puntos de montage usan rutas absolutas y tienen que existir. Synology
#     no las crea: si ./data no esta, falla con "Bind mount failed".
#
#  Si aun assim prefieres no usar compose, instalar-nas.sh hace lo mismo con un
#  solo `docker run`.
# =============================================================================

services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lucillas0/jarvis:latest
    container_name: jarvis
    restart: unless-stopped

    ports:
      # Solo en la LAN. /health, /api/* y /ws no piden contrasena: si esto llega
      # a internet, pon algo delante.
      - "${JARVIS_PUERTO:-8000}:8000"

    # Toda la configuracion se inyecta como variables de entorno. El .env tambien
    # se lee dentro del contenedor, pero sin montarlo: config.py busca
    # /app/brain/.env y el montaje de /app/.env no lo pillaba.
    env_file:
      - .env
    environment:
      TZ: "${TZ:-Europe/Madrid}"
      JARVIS_SERVER_MODE: "1"
      JARVIS_DATA_DIR: /data
      # El entrypoint baja a este usuario y le deja /data y /app/brain/db suyos.
      PUID: "${PUID:-1026}"
      PGID: "${PGID:-100}"
      # En un NAS no hay pantalla: por defecto el análisis continuo se apagaba
      # solo, pero solo si estaba en el .env. Aqui se pone a off.
      SCREEN_ANALYSIS_MODE: "${SCREEN_ANALYSIS_MODE:-off}"

    volumes:
      # Datos: base de datos, memoria, registros. Sobrevive a las actualizaciones.
      # ESTA CARPETA TIENE QUE EXISTIR ANTES de crear el proyecto.
      - "${JARVIS_DATOS:-./data}:/data"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else sys.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"