<style>
:root{--bg:#0b0d12;--panel:#12161e;--raised:#1b212c;--line:#283040;--text:#e8edf5;--muted:#8a96a8;--font:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid #5ad1e6;outline-offset:2px}
#island{--h:36px;position:relative;margin:0 auto;background:#000;border-radius:0 0 24px 24px;overflow:hidden;width:220px;height:36px;box-shadow:0 14px 40px rgba(0,0,0,.55);transition:width .45s cubic-bezier(.34,1.15,.64,1),height .45s cubic-bezier(.34,1.15,.64,1),border-radius .4s}
#island[data-open=true]{width:min(calc(100vw - 24px),680px);height:var(--h);border-radius:0 0 26px 26px}
.mini{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 8px;border:0;background:none;width:100%;transition:opacity .2s}.minis{display:grid;grid-template-columns:repeat(2,13px);gap:3px}#island[data-open=true] .mini{opacity:0;pointer-events:none}
.jarvis{position:absolute;top:0;left:50%;width:min(calc(100vw - 24px),680px);opacity:0;pointer-events:none;transform:translateX(-50%) scale(.96);transform-origin:50% 0;transition:opacity .2s,transform .4s cubic-bezier(.34,1.4,.64,1)}#island[data-open=true] .jarvis{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 16px 6px}.tab{width:32px;height:29px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}.tab[aria-selected=true]{background:var(--raised);color:var(--text)}.tab svg{width:16px;height:16px}.spacer{flex:1}.running{font-size:11px;color:var(--muted);margin-right:4px}.panel{padding:6px 16px 14px}.panel[hidden]{display:none}.btn{font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--raised)}.btn:hover{background:#273042}.btn.primary{background:#eef2f8;color:#10151f;border-color:#eef2f8;font-weight:600}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}.card{background:#14171e;border:1px solid #1f2430;border-radius:16px;padding:10px 12px}.main{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:center}.main .pet{--s:100px}.name{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--bc,#8a96a8);flex:none}.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step{font-size:11px;color:var(--muted)}.go{border:0;background:transparent;color:#93a1b5}.cmd{margin:0 0 8px;padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;font:12px ui-monospace,Consolas,monospace;color:#c8d3e3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:7px}.tl{font-size:12px;color:#9aa6b8;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl code{color:var(--text);font-family:ui-monospace,Consolas,monospace;font-size:11px}.info:not([data-state=permission]) .perm{display:none}.info[data-state=permission] .tasks{display:none}.agents{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:center}.ag{display:flex;align-items:center;gap:5px;padding:4px 8px 4px 4px;border-radius:999px;border:1px solid #232a38;background:#0f1218;font-size:11px}.ag[aria-pressed=true]{border-color:#3a4458;background:#1b212c}.ag .pet{--s:25px}.ag span{flex:1;text-align:center}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:7px}.chead b{display:block;font-size:13px}.chead span{font-size:11px;color:var(--muted)}.msgs{height:150px;overflow:auto;display:flex;flex-direction:column;gap:7px;padding:4px 2px}.msg{max-width:85%;padding:7px 10px;border-radius:12px;font-size:12px;line-height:1.4;background:var(--raised);overflow-wrap:anywhere}.msg.me{align-self:flex-end;background:#eef2f8;color:#10151f;border-bottom-right-radius:4px}.msg.ai{border-bottom-left-radius:4px}.msg.sys{align-self:center;color:var(--muted);font-size:11px;background:transparent}.composer{display:flex;gap:7px;margin-top:8px}.composer input,textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:12px}.send{width:36px;border-radius:50%;border:0;background:#eef2f8;color:#10151f}.clip{background:var(--raised);color:var(--text)}textarea{resize:vertical;margin-bottom:8px}.row{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}.chip{font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}.chip[aria-pressed=true]{color:var(--text);background:var(--raised)}.drop{margin-top:9px;border:1px dashed #2f394c;border-radius:12px;padding:9px;text-align:center;font-size:12px;color:var(--muted)}.drop.over{border-color:#5ad1e6;background:rgba(90,209,230,.07)}.files{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:65px;overflow:auto}.file{font-size:11px;color:var(--muted);padding:3px 7px;background:var(--bg);border-radius:7px;display:flex;justify-content:space-between}
.pet{--s:116px;--t1:#f4f6fa;--t2:#c9d0dc;--g:rgba(0,0,0,0);--ink:#14161c;--sp:cubic-bezier(.34,1.56,.64,1);font-size:var(--s);position:relative;width:1em;height:1em;flex:none;transform-origin:50% 85%;transition:--t1 .6s,--t2 .6s,--g .6s,--bc .6s}.pet i,.pet b{position:absolute;display:block}.pet .glow{inset:-18%;border-radius:50%;background:radial-gradient(circle,var(--g),transparent 62%);animation:glow 3.4s ease-in-out infinite}.pet .shadow{left:22%;right:22%;bottom:5%;height:.045em;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(.02em)}.pet .rig{position:absolute;inset:0;transform-origin:50% 84%;will-change:transform}.pet .body{position:absolute;left:11%;top:20%;width:78%;height:62%;border-radius:46% 46% 42% 42%/56% 56% 44% 44%;background:radial-gradient(circle at 34% 20%,#fff 0,var(--t1) 40%,var(--t2) 100%);box-shadow:inset -.03em -.05em .08em #0003,0 .05em .12em #0006}.pet .face{position:absolute;left:0;right:0;top:46%;height:.2em;display:flex;justify-content:center;align-items:center}.pet .face:before,.pet .face:after{content:"";position:absolute;top:.1em;width:.075em;height:.042em;border-radius:50%;background:#ff9fb2;opacity:.5;filter:blur(.006em)}.pet .face:before{left:10%}.pet .face:after{right:10%}.pet .eyes{display:flex;gap:.19em;align-items:center}.pet .eye{position:relative;width:.075em;height:.105em;border-radius:50%;background:var(--ink);animation:blink 5s infinite}.pet .eye:after{content:"";position:absolute;left:24%;top:14%;width:34%;height:30%;border-radius:50%;background:#fff}.pet .hand{top:58%;width:.12em;height:.12em;border-radius:50%;background:var(--t2);opacity:0}.pet .hand.l{left:0}.pet .hand.r{right:0}.pet .badge{left:11%;top:14%;width:calc(var(--s)*.15);height:calc(var(--s)*.15);border-radius:50%;background:var(--bc);border:calc(var(--s)*.016) solid #090b10;display:none;place-items:center;font:700 calc(var(--s)*.09)/1 var(--font);color:#05212a}.pet .doc{left:46%;top:2%;width:.1em;height:.13em;border-radius:.014em;background:#fff;opacity:0}.pet .star{opacity:0;color:#fff;font-size:calc(var(--s)*.1)}.pet .s1{left:26%;top:6%}.pet .s2{left:56%;top:0}.pet .s3{left:74%;top:10%}
[data-state=permission]{--bc:#ff9f1a}[data-state=question]{--t1:#dcf8ff;--t2:#5cc9e6;--g:#50c8e675;--bc:#19c3e6}[data-state=error]{--t1:#ffdcdf;--t2:#ff6f7a;--g:#ff465966;--bc:#ff4d5a}[data-state=finished]{--t1:#e0f8ec;--t2:#78dcae;--g:#3cdc9659;--bc:#2fd18d}[data-state=working]{--t1:#d9e8ff;--t2:#68a5ff;--g:#468cff66;--bc:#3b8cff}[data-state=thinking]{--t1:#e8deff;--t2:#a08bff;--g:#9664ff66;--bc:#8b5cf6}[data-state=dizzy]{--t1:#fbe3f1;--t2:#e58fc4;--g:#ec489966;--bc:#ec4899}.pet[data-state=permission] .badge,.pet[data-state=error] .badge,.pet[data-state=question] .badge,.pet[data-state=finished] .badge{display:grid}.pet[data-state=question] .badge:after{content:"?"}.pet[data-state=finished] .badge:after{content:"✓"}.pet[data-state=working] .badge,.pet[data-state=thinking] .badge{display:flex;align-items:center;justify-content:center;gap:calc(var(--s)*.028);width:calc(var(--s)*.3);border-radius:calc(var(--s)*.1);border-color:var(--bc);background:#0b0d13}.pet[data-state=working] .badge u,.pet[data-state=thinking] .badge u{display:block;width:calc(var(--s)*.036);height:calc(var(--s)*.036);border-radius:50%;background:var(--bc);animation:dot 1s infinite}.pet[data-state=greeting] .eye,.pet[data-state=finished] .eye{height:.05em;width:.1em;border-radius:50% 50% 0 0;background:none;border-top:.028em solid var(--ink);animation:none}.pet[data-state=greeting] .hand,.pet[data-state=finished] .hand{opacity:1;top:38%}.pet[data-state=finished] .star{animation:twinkle 1.6s ease-out infinite}@keyframes glow{50%{opacity:.7;transform:scale(1.06)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}@keyframes dot{0%,100%{transform:scale(.55);opacity:.45}40%{transform:scale(1.15);opacity:1}}@keyframes twinkle{0%{opacity:0;transform:translateY(.04em)}40%{opacity:1}100%{opacity:0;transform:translateY(-.08em)}}
@media(max-width:560px){.stage{grid-template-columns:1fr}.agents{display:none}.main{grid-template-columns:88px 1fr}.main .pet{--s:88px}}
</style>

<body>
<div class="island" id="island" data-open="false">
<button class="mini" id="mini" aria-label="Abrir JARVIS"><div class="pet" id="petMini" data-state="idle" style="--s:38px"></div><div class="minis" aria-hidden="true"><div class="pet" style="--s:13px"></div><div class="pet" style="--s:13px;--t1:#d7f5ea;--t2:#4fd1a0"></div><div class="pet" style="--s:13px;--t1:#ffd9e2;--t2:#f0627f"></div><div class="pet" style="--s:13px;--t1:#ffe6c7;--t2:#ff9f40"></div></div></button>
<section class="jarvis" id="jarvis" aria-label="JARVIS">
<div class="topbar" role="tablist"><button class="tab" data-tab="home" aria-selected="true" aria-label="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button><button class="tab" data-tab="chat" aria-selected="false" aria-label="Chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg></button><button class="tab" data-tab="new" aria-selected="false" aria-label="Nueva tarea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button><span class="spacer"></span><span class="running" id="running">JARVIS</span><button class="tab" id="openMain" aria-label="Abrir ventana principal">↗</button><button class="tab" id="hideNotch" aria-label="Ocultar Notch">×</button></div>
<section class="panel" id="p-home"><div class="stage"><div class="card main"><div class="pet" id="petHome" data-state="idle"></div><div class="info" id="info" data-state="idle"><div class="name"><span class="dot"></span><b>JARVIS</b><span class="status" id="status">Listo</span><span class="spacer"></span><button class="go" id="homeChat" aria-label="Abrir chat">↗</button></div><div class="perm"><div class="cmd" id="cmd">Esperando una tarea</div><div class="actions"><button class="btn" data-act="deny">Cancelar</button><button class="btn primary" data-act="allow">Permitir</button><button class="btn" data-act="always">Siempre</button></div></div><div class="tasks"><div class="tl" id="taskLine">Listo para ayudar.</div></div></div></div><div class="card agents" id="agents"><button class="ag" aria-pressed="true"><div class="pet" data-state="idle"></div><span>JARVIS</span></button><button class="ag" aria-pressed="false"><div class="pet" data-state="idle" style="--t1:#d7f5ea;--t2:#4fd1a0"></div><span>Cursor</span></button><button class="ag" aria-pressed="false"><div class="pet" data-state="idle" style="--t1:#ffd9e2;--t2:#f0627f"></div><span>Codex</span></button><button class="ag" aria-pressed="false"><div class="pet" data-state="idle" style="--t1:#ffe6c7;--t2:#ff9f40"></div><span>GitHub</span></button></div></div></section>

<section class="panel" id="p-new" hidden><div class="chead"><div class="pet" id="petNew" data-state="idle" style="--s:46px"></div><div><b>Nueva tarea</b><span id="newStatus">¿Qué hacemos?</span></div></div><textarea id="taskText" rows="2" placeholder="Describe la tarea…"></textarea><div class="drop" id="drop" tabindex="0">Arrastra archivos aquí o haz clic</div><input type="file" id="file" multiple hidden><div class="files" id="files" hidden></div><div class="row" id="mode"><button class="chip" data-m="ask" aria-pressed="true">Pedir permiso</button><button class="chip" data-m="auto" aria-pressed="false">Automático</button><button class="chip" data-m="read" aria-pressed="false">Solo lectura</button><span class="spacer"></span><button class="btn primary" id="start">Iniciar tarea</button></div></section>
</section></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],wait=ms=>new Promise(r=>setTimeout(r,ms));
const PET='<i class="glow"></i><i class="shadow"></i><div class="rig"><i class="hand l"></i><div class="body"><div class="face"><div class="eyes"><i class="eye"></i><i class="eye"></i></div></div></div><i class="hand r"></i><b class="badge"><u></u><u></u><u></u></b></div><i class="doc"></i><b class="star s1">✦</b><b class="star s2">✧</b><b class="star s3">✦</b>';
$$('.pet').forEach(p=>p.innerHTML=PET);
const pets=$$('.pet'),S=Math.sin,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),states=['idle','permission','greeting','working','thinking','upload','question','error','finished','dance'];
const motion={idle:t=>[Math.sin(t*1.35)*.01,Math.sin(t*.67)*2,1],permission:t=>[Math.sin(t*2.1)*.02,Math.sin(t*1.8)*5,1],thinking:t=>[Math.sin(t)*.015,Math.sin(t*1.4)*4,1],working:t=>[Math.sin(t*7)*.008,Math.sin(t*5)*2,1],finished:t=>[Math.sin(t*2)*.02,Math.sin(t*3)*9,1.1],error:t=>[Math.sin(t*18)*.025,0,.92],greeting:t=>[Math.sin(t*3)*.01,Math.sin(t*3)*3,1],upload:t=>[Math.sin(t*2)*.01,3,1],question:t=>[Math.sin(t)*.012,4,1],dance:t=>[Math.sin(t*6)*.04,Math.abs(Math.sin(t*6))*7,1.1]};
const pose=pets.map(()=>({x:0,r:0,q:1}));let start=performance.now();
function frame(now){pets.forEach((p,i)=>{const [x,r,q]=(motion[p.dataset.state]||motion.idle)((now-start)/1000+i);const m=pose[i];m.x+=(x-m.x)*.12;m.r+=(r-m.r)*.12;m.q+=(q-m.q)*.12;const rig=p.querySelector('.rig');if(rig)rig.style.transform=`translateY(${-m.r}px) rotate(${m.x*300}deg) scale(${m.q})`;});requestAnimationFrame(frame)}requestAnimationFrame(frame);
const LABEL={idle:'Listo',permission:'Esperando permiso',greeting:'Hola',working:'En marcha…',thinking:'Pensando…',upload:'Adjuntando…',question:'Necesito más información',error:'No se pudo completar',finished:'Terminado',dance:'¡Hecho!'};
const api=window.jarvisNotchAPI;let ws=null,reconnectTimer=0,wsReady=false,waiting=0;
function connect(){clearTimeout(reconnectTimer);try{ws=new WebSocket('ws://127.0.0.1:8000/ws')}catch{setConnected(false);reconnectTimer=setTimeout(connect,2500);return}ws.onopen=()=>{wsReady=true;setConnected(true)};ws.onclose=()=>{wsReady=false;setConnected(false);reconnectTimer=setTimeout(connect,2500)};ws.onerror=()=>setConnected(false);ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='assistant_reply'&&d.text){say('ai',d.text);pet('#petChat','finished');pet('#petMini','finished');$('#status').textContent='Listo';$('#taskLine').textContent=d.text.slice(0,150);if(waiting)waiting=Math.max(0,waiting-1);if(!waiting)home('finished');setTimeout(()=>{if(!waiting)home('idle')},2200)}else if(d.type==='conversation_state'){if(d.state==='thinking'||d.state==='speaking'){pet('#petChat',d.state==='thinking'?'thinking':'working');home(d.state==='thinking'?'thinking':'working');$('#status').textContent=d.state==='thinking'?'Pensando…':'Respondiendo…'}}else if(d.type==='task_step'){home('working');$('#taskLine').textContent=String(d.label||'Procesando tarea').slice(0,150)}else if(d.type==='action_status'){const label=d.label||d.tool||'Tarea';$('#cmd').textContent=label;$('#status').textContent=d.state==='done'?'Completado':'En curso';home(d.state==='done'?'finished':'working')}else if(d.type==='user_heard'){home('thinking');$('#cmd').textContent=String(d.text||'').slice(0,150)}else if(d.type==='hello'){if(d.message)$('#chatStatus').textContent=d.message}else if(d.type==='selfheal_update'){home(d.stage==='fixed'?'finished':'error');$('#taskLine').textContent=String(d.note||d.error||'Revisión automática').slice(0,150)}}}
function setConnected(on){wsReady=on;$('#chatStatus').textContent=on?'En línea':'Reconectando…';$('#running').textContent=on?'JARVIS · EN LÍNEA':'JARVIS · SIN CONEXIÓN'}
function sendWs(msg){if(!ws||ws.readyState!==WebSocket.OPEN){connect();return false}ws.send(JSON.stringify(msg));return true}
function say(who,text){const m=document.createElement('div');m.className='msg '+who;m.textContent=text;$('#msgs').append(m);$('#msgs').scrollTop=1e9}
function home(state){pet('#petHome',state);pet('#petMini',state);$('#info').dataset.state=state;$('#status').textContent=LABEL[state]||state}
function pet(selector,state){const el=$(selector);if(el)el.dataset.state=state}
function tab(name){$$('.tab[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===name));for(const k of ['home','chat','new'])$('#p-'+k).hidden=k!==name;if(name==='chat')setTimeout(()=>$('#chatIn').focus(),80);resizeNotch(true)}
function resizeNotch(expanded){const height=$('#jarvis').scrollHeight+8;if(api?.setExpanded)api.setExpanded(expanded,height)}
$$('.tab[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('#homeChat').onclick=()=>tab('chat');$('#openMain').onclick=()=>api?.openMain();$('#hideNotch').onclick=()=>api?.hide();$('#mini').onclick=()=>openIsland(true);
let isOpen=false,hoverTimer=0;const island=$('#island');function openIsland(open){isOpen=!!open;island.dataset.open=isOpen?'true':'false';resizeNotch(isOpen)}island.addEventListener('pointerenter',()=>{clearTimeout(hoverTimer);openIsland(true)});island.addEventListener('pointerleave',()=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;hoverTimer=setTimeout(()=>openIsland(false),650)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){openIsland(false);}});document.addEventListener('pointerdown',e=>{if(!island.contains(e.target))openIsland(false)});
const ft={};function flash(selector,state,ms=1800){clearTimeout(ft[selector]);pet(selector,state);ft[selector]=setTimeout(()=>pet(selector,'idle'),ms)}
const links=[{n:'YouTube',u:'https://www.youtube.com'},{n:'Gmail',u:'https://mail.google.com'},{n:'Calendario',u:'https://calendar.google.com'},{n:'Drive',u:'https://drive.google.com'},{n:'GitHub',u:'https://github.com'}];
function command(text){const m=text.trim().match(/^(?:abre|abrir|open)\s+(.+)$/i);if(m){const name=m[1].trim().toLowerCase(),hit=links.find(x=>x.n.toLowerCase()===name);const url=hit?hit.u:/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(name)?'https://'+name:null;if(!url)return{handled:true,ok:false,text:'No conozco ese acceso.'};api?.openExternal(url);return{handled:true,ok:true,text:'Abriendo '+(hit?hit.n:name)+'…'}}const q=text.trim().match(/^(?:busca|buscar|googlea|search)\s+(.+)$/i);if(q){api?.openExternal('https://www.google.com/search?q='+encodeURIComponent(q[1]));return{handled:true,ok:true,text:'Buscando «'+q[1]+'»…'}}return null}
function sendMessage(text){const m=text.trim();if(!m)return;const c=command(m);say('me',m);if(c){say('ai',c.text);flash('#petChat',c.ok?'finished':'question');return}if(!sendWs({type:'user_message',message:m,input_mode:'text',speak:$('#sound').getAttribute('aria-pressed')!=='false'})){say('sys','No se pudo conectar con el cerebro. Reintentando…');return}waiting++;home('thinking');pet('#petChat','thinking');$('#status').textContent='Pensando…';$('#chatStatus').textContent='JARVIS está pensando…'}
$('#send').onclick=()=>{const i=$('#chatIn');sendMessage(i.value);i.value=''};$('#chatIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#send').click()}};
$('#clip').onclick=()=>$('#chatFile').click();$('#chatFile').onchange=()=>{const names=[...$('#chatFile').files].map(f=>f.name);if(names.length)say('sys','Adjuntos seleccionados: '+names.join(', ')+'. Arrástralos a Nueva tarea para analizarlos.');$('#chatFile').value=''};
let mode='ask',files=[];$$('#mode .chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#mode .chip').forEach(c=>c.setAttribute('aria-pressed',c===b))});
const drop=$('#drop'),fileInput=$('#file');drop.onclick=()=>fileInput.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click()}};fileInput.onchange=()=>{addFiles(fileInput.files);fileInput.value=''};let depth=0;drop.addEventListener('dragenter',e=>{e.preventDefault();depth++;drop.classList.add('over')});drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('dragleave',()=>{if(--depth<=0){depth=0;drop.classList.remove('over')}});drop.addEventListener('drop',e=>{e.preventDefault();depth=0;drop.classList.remove('over');addFiles(e.dataTransfer.files)});document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());
function addFiles(fileList){for(const f of fileList){if(files.some(x=>x.name===f.name&&x.size===f.size))continue;files.push(f);const row=document.createElement('div');row.className='file';row.innerHTML='<span></span><button type="button" aria-label="Quitar">×</button>';row.firstChild.textContent=f.name+' · '+(f.size/1024).toFixed(1)+' KB';row.lastChild.onclick=()=>{files=files.filter(x=>x!==f);row.remove();$('#files').hidden=!files.length};$('#files').append(row);$('#files').hidden=false}}
$('#taskText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#start').click()}};$('#start').onclick=()=>{const text=$('#taskText').value.trim();if(!text&&!files.length){flash('#petNew','question');$('#newStatus').textContent='Describe la tarea primero';return}const task=[text||('Analiza '+files.length+' archivo(s)'),...files.map(f=>f.name)].join('\nArchivos: ');if(!sendWs({type:'user_message',message:task,input_mode:'text',speak:true})){say('sys','El cerebro no está conectado. No se ha iniciado la tarea.');return}waiting++;$('#taskText').value='';files=[];$('#files').replaceChildren();$('#files').hidden=true;$('#newStatus').textContent='Enviada al cerebro';$('#cmd').textContent=text||'Analizando archivos';home('working');pet('#petNew','working');tab('home')};
$$('.actions').onclick=e=>{if(e.target.dataset.act==='deny'){home('slap');setTimeout(()=>home('permission'),1500)}else{home('working');$('#status').textContent='Las aprobaciones llegan desde JARVIS';setTimeout(()=>home('idle'),2500)}};
$$('.ag').forEach(b=>b.onclick=()=>{$$('.ag').forEach(c=>c.setAttribute('aria-pressed',c===b));$('#status').textContent=b.querySelector('span').textContent==='JARVIS'?'Listo':'Agente externo no conectado'});
api?.onEvent?.(d=>{if(d.type==='assistant_reply'&&d.text){say('ai',d.text);if(waiting)waiting=Math.max(0,waiting-1);home('finished');setTimeout(()=>{if(!waiting)home('idle')},2200)}else if(d.type==='conversation_state'){if(d.state==='thinking')home('thinking');else if(d.state==='speaking')home('working')}else if(d.type==='task_step'){$('#taskLine').textContent=String(d.label||'Tarea en curso').slice(0,150);home('working')}else if(d.type==='action_status'){const label=d.label||d.tool||'Tarea';$('#cmd').textContent=label;$('#taskLine').textContent=label;home(['done','failed','cancelled'].includes(d.state)?(d.state==='done'?'finished':'error'):'working')}else if(d.type==='user_heard'){$('#cmd').textContent=String(d.text||'').slice(0,150);home('thinking')}else if(d.type==='selfheal_update'){home(d.stage==='fixed'?'finished':'error');$('#taskLine').textContent=String(d.note||d.error||'Revisión automática').slice(0,150)}});
window.addEventListener('resize',()=>resizeNotch(isOpen));connect();setTimeout(()=>openIsland(false),350);resizeNotch(false);
</script>
