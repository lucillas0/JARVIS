<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
</head>
<body>
  <div id="orbRoot" class="orb-root"></div>

  <div class="overlay-vignette"></div>
  <div class="overlay-grain"></div>
  <div class="overlay-scanlines"></div>

  <div class="voice-wrap">
    <canvas id="voiceLine" class="voice-line-canvas"></canvas>
  </div>

  <div class="hud hud-title">J.A.R.V.I.S.</div>

  <div id="thinkTree" class="think-tree">
    <div class="tt-root"><span class="tt-dot"></span><span id="ttTitle">EN REPOSO</span></div>
    <ul id="ttList" class="tt-list"></ul>
  </div>

  <div class="hud hud-controls">
    <div id="cameraPanel" class="camera-panel">
      <video id="camVideo" muted playsinline class="camera-video"></video>
      <canvas id="camOverlay" width="320" height="240" class="camera-overlay"></canvas>
      <div id="cameraStatus" class="camera-status">Apagada</div>
      <div id="handHint" class="hud-hint"></div>
    </div>

    <div id="handCursor" class="hud-hand-cursor" hidden></div>

    <div id="hudError" class="hud-error"></div>

    <div id="micTranscript" class="mic-transcript" title="Lo que oigo y recibe JARVIS">Micrófono activo</div>
    <div class="hud-row">
      <button id="micBtn" type="button" class="hud-btn" aria-pressed="true">MIC ON</button>
      <button id="gesturesBtn" type="button" class="hud-btn" aria-pressed="false">GESTURES OFF</button>
    </div>
    <div class="hud-row">
      <button id="zoomInBtn" type="button" class="hud-btn" aria-label="Zoom in">+</button>
      <button id="zoomOutBtn" type="button" class="hud-btn" aria-label="Zoom out">−</button>
      <button id="resetBtn" type="button" class="hud-btn">RESET</button>
    </div>
  </div>

  <script src="gestures.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
