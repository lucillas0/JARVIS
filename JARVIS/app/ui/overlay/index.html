<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>J.A.R.V.I.S. Overlay</title>
<link rel="stylesheet" href="overlay.css" />
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three.module.js",
    "three/addons/": "../vendor/jsm/"
  }
}
</script>
</head>
<body>
  <!-- Fondo interactivo: soporta drop de archivos -->
  <div id="dropArea" class="drop-area">
    <div id="dropHint" class="drop-hint">Suelta aquí fotos, PDF, documentos… o usa FILES</div>
  </div>

  <!-- Botón cerrar overlay (solo lo oculta) -->
  <button id="closeBtn" class="close-btn" title="Cerrar pizarra (Win+J)" aria-label="Cerrar">✕</button>

  <!-- Botón abrir ventana principal -->
  <button id="mainBtn" class="close-btn main-toggle" title="Abrir ventana principal de JARVIS" aria-label="Abrir ventana principal">⛶</button>

  <!-- Botón gestos de mano -->
  <button id="gesturesBtn" class="close-btn gestures-toggle" title="Activar gestos de mano" aria-pressed="false">👐</button>

  <!-- Columna derecha: monitor + chat (flex, sin solapes) -->
  <div id="rightColumn" class="right-column">
    <!-- Widget rendimiento (arriba) -->
    <div id="perfWidget" class="widget perf-widget">
      <div class="widget-title">SYSTEM PERFORMANCE</div>
      <div class="perf-row">
        <span class="perf-label">CPU</span>
        <div class="perf-bar"><div id="perfCpu" class="perf-fill"></div></div>
        <span id="perfCpuTxt" class="perf-val">0%</span>
      </div>
      <div class="perf-row">
        <span class="perf-label">RAM</span>
        <div class="perf-bar"><div id="perfMem" class="perf-fill"></div></div>
        <span id="perfMemTxt" class="perf-val">0%</span>
      </div>
    </div>

    <!-- Tarjeta de autocorrección: qué error encontró y qué está haciendo -->
    <div id="healCard" class="heal-card" hidden>
      <div class="heal-title">🔧 AUTOCORRECCIÓN <span id="healDot" class="heal-dot">●</span></div>
      <div id="healText" class="heal-text">Sin errores.</div>
      <div id="healBtns" class="heal-btns" hidden>
        <button id="healAllowBtn" class="heal-btn allow">✔ Permitir</button>
        <button id="healDenyBtn" class="heal-btn deny">✘ Denegar</button>
      </div>
    </div>

    <!-- Panel de chat con JARVIS (debajo del monitor) -->
    <div id="chatPanel" class="chat-panel">    <div class="chat-head">
      <span class="chat-head-title"><span id="wsDot" class="ws-dot" title="Sin conexión">●</span> CHAT</span>
        <button id="chatCollapseBtn" class="chat-collapse-btn" title="Colapsar chat (solo micrófono)" aria-label="Colapsar chat">—</button>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <div class="chat-toolbar">
        <input id="chatInput" class="chat-input" placeholder="Escríbeme algo…" />
        <button id="micBtn" class="mic-btn" title="Hablar con JARVIS">🎙️</button>
        <button id="sendBtn" class="send-btn" title="Enviar">➤</button>
      </div>
    </div>
  </div>

  <!-- Widget apps / archivos (izquierda) -->
  <div class="widget side-widget">
    <div class="widget-title">QUICK LAUNCH</div>
    <div class="side-tabs">
      <button id="tabApps" class="side-tab active">APPS</button>
      <button id="tabFiles" class="side-tab">FILES</button>
    </div>
    <div id="fileNav" class="file-nav" hidden>
      <button id="navUp" class="nav-up" title="Subir un nivel">←</button>
      <div id="navPath" class="nav-path" title="Ruta">…</div>
    </div>
    <div id="sideList" class="side-list"></div>
  </div>

  <!-- Cámara + canvas de gestos (ocultos hasta activar) -->
  <video id="camVideo" muted playsinline class="camera-video"></video>
  <canvas id="camOverlay" class="camera-overlay"></canvas>

  <!-- Puntero de referencia de la mano (visible con gestos activos) -->
  <div id="handCursor" class="hand-cursor" hidden></div>

  <!-- Tarjetas de archivos/imágenes -->
  <div id="imgLayer" class="img-layer"></div>

  <!-- Lector de documentos / imágenes (dentro del overlay, sin salir) -->
  <div id="reader" class="reader" hidden>
    <div class="reader-bar">
      <button id="readerClose" class="reader-btn" title="Cerrar lector">✕</button>
      <div id="readerTitle" class="reader-title">…</div>
      <div class="reader-actions">
        <button id="readerZoomOut" class="reader-btn" title="Reducir">A−</button>
        <button id="readerZoomIn" class="reader-btn" title="Agrandar">A+</button>
      </div>
    </div>
    <div id="readerBody" class="reader-body">
      <pre id="readerText" class="reader-text"></pre>
      <img id="readerImg" class="reader-img" alt="" />
      <div class="reader-ask">
        <input id="readerAskInput" class="reader-ask-input" placeholder="Pregúntale algo a JARVIS sobre este documento…" />
        <button id="readerAskBtn" class="reader-ask-btn" title="Preguntar a JARVIS">➤</button>
      </div>
    </div>
  </div>

  <!-- Mini JARVIS: orbe vivo en la esquina inferior derecha -->
  <div id="orbStage" class="orb-stage"></div>

  <!-- Modo cámara a pantalla completa -->
  <div id="cameraMode" class="camera-mode" hidden>
    <div class="camera-mode-bar">
      <button id="cameraCloseBtn" class="close-btn" title="Apagar cámara (vuelve a la pizarra)" aria-label="Apagar cámara">✕</button>
      <div id="cameraModeTitle" class="camera-mode-title">CÁMARA · analiza lo que veas</div>
      <button id="cameraAnalyzeBtn" class="close-btn" title="Analizar lo que ve la cámara" aria-label="Analizar">👁</button>
    </div>
    <video id="cameraModeVideo" autoplay playsinline muted class="camera-mode-video"></video>
    <div id="cameraModeStatus" class="camera-mode-status" hidden></div>
  </div>

  <script src="../gestures.js"></script>
  <script src="app.js"></script>
  <script type="module" src="orb.js"></script>
</body>
</html>
