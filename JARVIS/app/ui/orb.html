<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>JARVIS · Orbe</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Courier New", monospace;
  }
  .orb {
    position: fixed;
    inset: 0;
    background: transparent;
    cursor: pointer;
    -webkit-app-region: drag;
  }
  .orb .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #orbContainer { width: 100%; height: 100%; }
  .orb canvas { display: block; }
</style>
</head>
<body>
  <div id="app" class="orb">
    <div class="stage">
      <div id="orbContainer"></div>
    </div>
  </div>

  <script type="module" src="orb-renderer.js"></script>
</body>
</html>
