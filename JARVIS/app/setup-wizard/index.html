<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurar JARVIS</title>
  <link rel="stylesheet" href="wizard.css">
</head>
<body>
  <main class="wizard">
    <header>
      <p class="eyebrow">PRIMER INICIO</p>
      <h1>Conectemos JARVIS</h1>
      <p class="intro">Añade al menos una clave de proveedor para activar las respuestas. Puedes configurar las demás más adelante.</p>
    </header>

    <section class="providers" aria-label="Claves de proveedores">
      <div class="card">
        <label for="groq">Groq <span class="badge">Rápido</span></label>
        <input id="groq" type="password" placeholder="GROQ_API_KEY" autocomplete="off" spellcheck="false">
        <small>Obtén una clave en <a href="https://console.groq.com/keys">console.groq.com/keys</a></small>
      </div>
      <div class="card">
        <label for="gemini">Google Gemini</label>
        <input id="gemini" type="password" placeholder="GEMINI_API_KEY" autocomplete="off" spellcheck="false">
        <small>Obtén una clave en <a href="https://aistudio.google.com/apikey">aistudio.google.com</a></small>
      </div>
      <div class="card">
        <label for="openrouter">OpenRouter</label>
        <input id="openrouter" type="password" placeholder="OPENROUTER_API_KEY" autocomplete="off" spellcheck="false">
        <small>Obtén una clave en <a href="https://openrouter.ai/keys">openrouter.ai/keys</a></small>
      </div>
    </section>

    <footer>
      <span id="msg" class="msg" role="status" aria-live="polite"></span>
      <div class="actions">
        <button id="skipBtn" class="btn ghost" type="button">Continuar sin claves</button>
        <button id="saveBtn" class="btn primary" type="button">Guardar y arrancar</button>
      </div>
    </footer>
  </main>
  <script src="wizard.js"></script>
</body>
</html>
