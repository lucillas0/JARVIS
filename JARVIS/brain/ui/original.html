<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03070d;
    --bg-2: #07101b;
    --line: rgba(120, 200, 255, .14);
    --line-strong: rgba(120, 200, 255, .32);
    --text: #d8eefc;
    --dim: #6f8ba3;
    --accent: #2ec8ff;          /* el JS lo cambia según el estado */
    --accent-rgb: 46, 200, 255;
    --ok: #34f5b0;
    --warn: #ffb23e;
    --bad: #ff5c6c;
    --side-w: 330px;
    --ui: "Chakra Petch", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr var(--side-w);
    grid-template-rows: auto 1fr;
    grid-template-areas: "top side" "stage side";
  }

  /* ───────── barra superior ───────── */
  .top {
    grid-area: top;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    z-index: 3;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand h1 { font-size: 22px; font-weight: 600; letter-spacing: .32em; }
  .brand span { font-size: 13px; color: var(--dim); }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--dim); text-align: right; line-height: 1.5; }
  .clock b { color: var(--text); font-weight: 500; font-size: 18px; display: block; letter-spacing: .06em; }

  /* ───────── escenario ───────── */
  .stage {
    grid-area: stage;
    position: relative;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    min-height: 0;
    background:
      radial-gradient(ellipse 60% 55% at 50% 44%, rgba(var(--accent-rgb), .10), transparent 70%),
      radial-gradient(ellipse 100% 100% at 50% 50%, var(--bg-2), var(--bg) 75%);
    transition: background .6s;
  }
  #orb { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* anillos HUD alrededor del orbe (solo CSS, giran más rápido o más lento según estado) */
  .hud {
    position: absolute; left: 50%; top: 44%;
    width: min(74vh, 74%); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: .9;
  }
  .hud svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hud .r1 { transform-origin: 50% 50%; animation: spin var(--spin1, 60s) linear infinite; }
  .hud .r2 { transform-origin: 50% 50%; animation: spin var(--spin2, 90s) linear infinite reverse; }
  .hud .r3 { transform-origin: 50% 50%; animation: spin var(--spin3, 140s) linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hud circle, .hud path { fill: none; stroke: rgb(var(--accent-rgb)); transition: stroke .6s; }

  .readout {
    position: relative; z-index: 2;
    width: min(760px, calc(100% - 48px));
    text-align: center;
    margin-bottom: 14px;
    min-height: 74px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  }
  .readout .you { font-size: 14px; color: var(--dim); min-height: 20px; }
  .readout .jarvis { font-size: 19px; line-height: 1.45; color: var(--text); min-height: 28px; }
  .state-label {
    position: absolute; left: 50%; top: 44%;
    transform: translate(-50%, calc(min(37vh, 37%) + 22px));
    font-size: 14px; letter-spacing: .12em; color: rgb(var(--accent-rgb));
    transition: color .6s; pointer-events: none; white-space: nowrap;
  }

  /* ───────── barra de entrada ───────── */
  .composer {
    position: relative; z-index: 2;
    width: min(760px, calc(100% - 48px));
    margin-bottom: 26px;
    display: flex; align-items: center; gap: 4px;
    padding: 6px 6px 6px 22px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: rgba(4, 10, 18, .72);
    backdrop-filter: blur(10px);
    transition: border-color .3s, box-shadow .3s;
  }
  .composer:focus-within {
    border-color: rgb(var(--accent-rgb));
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .12), 0 0 40px rgba(var(--accent-rgb), .15);
  }
  .composer input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: 0;
    color: var(--text); font: 400 16px var(--ui);
    padding: 12px 0;
  }
  .composer input::placeholder { color: var(--dim); }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    color: var(--dim);
    transition: background .2s, color .2s, transform .15s;
  }
  .icon-btn:hover { background: rgba(var(--accent-rgb), .12); color: var(--text); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .mic-btn.on { color: var(--ok); background: rgba(52, 245, 176, .12); }
  .mic-btn.on::after {
    content: ""; position: absolute; width: 46px; height: 46px; border-radius: 50%;
    border: 1.5px solid var(--ok); animation: ping 1.6s ease-out infinite;
  }
  .mic-btn { position: relative; }
  .mic-btn .off-icon { display: none; }
  .mic-btn:not(.on) .on-icon { display: none; }
  .mic-btn:not(.on) .off-icon { display: block; }
  @keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(1.7); opacity: 0; } }
  .send-btn { background: rgb(var(--accent-rgb)); color: #03121c; transition: background .6s, transform .15s; }
  .send-btn:hover { background: rgb(var(--accent-rgb)); color: #03121c; filter: brightness(1.15); }

  /* ───────── barra lateral ───────── */
  .side {
    grid-area: side;
    border-left: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(7, 16, 27, .9), rgba(3, 7, 13, .95));
    display: flex; flex-direction: column;
    min-height: 0;
    z-index: 3;
  }
  .side h2 { font-size: 13px; font-weight: 500; color: var(--dim); letter-spacing: .08em; padding: 22px 24px 10px; }

  .proc { list-style: none; }
  .proc li {
    display: grid; grid-template-columns: 38px 1fr auto; gap: 14px; align-items: center;
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    position: relative;
    transition: background .3s;
  }
  .proc li:last-child { border-bottom: 1px solid var(--line); }
  .proc li::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--c); transform: scaleY(0); transform-origin: center; transition: transform .35s;
  }
  .proc li.active { background: rgba(var(--c-rgb), .07); }
  .proc li.active::before { transform: scaleY(1); }
  .proc .ico { width: 38px; height: 38px; display: grid; place-items: center; color: var(--dim); transition: color .3s; }
  .proc li.active .ico { color: var(--c); }
  .proc .ico svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .proc .name { font-size: 16px; font-weight: 500; }
  .proc .sub { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  .proc li.active .sub { color: var(--c); }
  .eq { display: flex; align-items: center; gap: 3px; height: 26px; width: 34px; justify-content: flex-end; }
  .eq i { display: block; width: 3px; height: 14%; background: var(--dim); border-radius: 2px; opacity: .5; transition: background .3s, opacity .3s; }
  .proc li.active .eq i { background: var(--c); opacity: 1; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; padding: 4px 24px 6px; gap: 0 20px; }
  .stats div { padding: 12px 0; border-top: 1px solid var(--line); }
  .stats dt { font-size: 12px; color: var(--dim); }
  .stats dd { font-family: var(--mono); font-size: 15px; margin-top: 3px; }

  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 24px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px;
  }
  .switch { width: 42px; height: 24px; border-radius: 99px; border: 1px solid var(--line-strong); position: relative; transition: background .25s, border-color .25s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: transform .25s, background .25s; }
  .switch[aria-checked="true"] { background: rgba(var(--accent-rgb), .22); border-color: rgb(var(--accent-rgb)); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); background: rgb(var(--accent-rgb)); }

  .log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); margin-top: 6px; }
  .log { flex: 1; overflow-y: auto; padding: 0 24px 20px; font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--dim); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .log p { padding: 2px 0; }
  .log time { color: rgba(var(--accent-rgb), .75); margin-right: 8px; }
  .log .u { color: var(--text); }
  .log .e { color: var(--bad); }
  .log .w { color: var(--warn); }

  /* ───────── adaptable ───────── */
  @media (max-width: 860px) {
    :root { --side-w: 100%; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; grid-template-areas: "top" "stage" "side"; }
    .side { border-left: 0; border-top: 1px solid var(--line); max-height: 36vh; overflow-y: auto; }
    .log-wrap, .stats, .toggle { display: none; }
    .proc li { padding: 10px 18px; }
    .hud { width: 86%; top: 40%; }
    .state-label { top: 40%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hud .r1, .hud .r2, .hud .r3, .mic-btn.on::after { animation: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand"><h1>JARVIS</h1><span id="host">Servidor local</span></div>
    <div class="clock"><b id="clock">--:--:--</b><span id="date"></span></div>
  </header>

  <main class="stage" id="stage">
    <canvas id="orb" aria-hidden="true"></canvas>

    <div class="hud" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <g class="r1"><circle cx="50" cy="50" r="49" stroke-width=".18" stroke-dasharray="0.4 1.6" opacity=".7"/>
          <path d="M50 1 A49 49 0 0 1 99 50" stroke-width=".5" opacity=".9"/><path d="M50 99 A49 49 0 0 1 1 50" stroke-width=".5" opacity=".9"/></g>
        <g class="r2"><circle cx="50" cy="50" r="45" stroke-width=".12" stroke-dasharray="6 2 1 2" opacity=".5"/>
          <path d="M5 50 A45 45 0 0 1 50 5" stroke-width=".35" opacity=".8"/></g>
        <g class="r3"><circle cx="50" cy="50" r="41" stroke-width=".1" stroke-dasharray="0.2 1" opacity=".6"/></g>
      </svg>
    </div>

    <div class="state-label" id="stateLabel">En espera</div>

    <div class="readout" aria-live="polite">
      <div class="you" id="you"></div>
      <div class="jarvis" id="jarvisText">A su servicio. ¿En qué puedo ayudarle?</div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Escriba una pregunta o pulse el micrófono" aria-label="Pregunta para JARVIS">
      <button type="button" class="icon-btn mic-btn" id="micBtn" aria-pressed="false" aria-label="Activar o desactivar el micrófono" title="Micrófono (M)">
        <svg class="on-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="off-icon" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5 2.2M15 9.5V6a3 3 0 0 0-5.6-1.5"/><path d="M5 11a7 7 0 0 0 11 5.7M19 11a7 7 0 0 1-.6 2.8M12 18v3"/></svg>
      </button>
      <button type="submit" class="icon-btn send-btn" aria-label="Enviar pregunta" title="Enviar">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </main>

  <aside class="side">
    <h2>Procesos</h2>
    <ul class="proc" id="proc">
      <li data-p="listening" style="--c:#34f5b0;--c-rgb:52,245,176">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 4v16M16 8v8M20 12h-2"/></svg></span>
        <span><div class="name">Escuchando</div><div class="sub">Inactivo</div></span>
        <span class="eq"><i></i><i></i><i></i><i></i><i></i></span>
      </li>
      <li data-p="thinking" style="--c:#ffb23e;--c-rgb:255,178,62">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>
        <span><div class="name">Pensando</div><div class="sub">Inactivo</div></span>
        <span class="eq"><i></i><i></i><i></i><i></i><i></i></span>
      </li>
      <li data-p="speaking" style="--c:#5b9bff;--c-rgb:91,155,255">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></span>
        <span><div class="name">Hablando</div><div class="sub">Inactivo</div></span>
        <span class="eq"><i></i><i></i><i></i><i></i><i></i></span>
      </li>
    </ul>

    <dl class="stats">
      <div><dt>Micrófono</dt><dd id="stMic">Apagado</dd></div>
      <div><dt>Consultas</dt><dd id="stQ">0</dd></div>
      <div><dt>Tiempo activo</dt><dd id="stUp">00:00</dd></div>
      <div><dt>Última respuesta</dt><dd id="stLat">—</dd></div>
    </dl>

    <div class="toggle">
      <span>Respuesta por voz</span>
      <button type="button" class="switch" id="ttsSwitch" role="switch" aria-checked="true" aria-label="Respuesta por voz"></button>
    </div>

    <div class="log-wrap">
      <h2>Registro</h2>
      <div class="log" id="log"></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════════════════
   CONFIGURACIÓN — aquí conectas tu servidor
   ════════════════════════════════════════════════════════════
   Si pones una URL en `endpoint`, JARVIS hará:
       POST endpoint   { "message": "tu pregunta" }
   y espera:  { "reply": "la respuesta" }
   Si está vacío, responde en modo demostración.               */
const CONFIG = {
  endpoint: '',            // p. ej. 'http://192.168.1.50:8000/ask'
  headers: {},             // p. ej. { 'Authorization': 'Bearer ...' }
  lang: 'es-ES',
  voiceRate: 1.0,
  voicePitch: 0.85,
};

/* ───────── utilidades ───────── */
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const lerp = (a, b, k) => a + (b - a) * k;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── estados del orbe ─────────
   amp: cuánto se deforma · freq: tamaño del ruido · speed: velocidad del ruido
   ring: velocidad de giro de los anillos · spin: giro de partículas · size: escala */
const STATES = {
  idle:      { label: 'En espera',  color: '#2ec8ff', amp: 0.10, freq: 1.1, speed: 0.30, ring: 0.25, spin: 0.06, size: 1.00, glow: 0.55 },
  listening: { label: 'Escuchando', color: '#34f5b0', amp: 0.16, freq: 1.5, speed: 0.55, ring: 0.45, spin: 0.10, size: 1.04, glow: 0.8  },
  thinking:  { label: 'Pensando',   color: '#ffb23e', amp: 0.30, freq: 2.4, speed: 1.90, ring: 2.40, spin: 0.55, size: 0.92, glow: 1.0  },
  speaking:  { label: 'Hablando',   color: '#5b9bff', amp: 0.20, freq: 1.8, speed: 0.90, ring: 0.80, spin: 0.14, size: 1.06, glow: 1.0  },
};

let state = 'idle';
let micOn = false;
let micLevel = 0;        // 0..1, nivel real del micrófono
let voiceEnv = 0;        // 0..1, envolvente de la voz de JARVIS
let boundaryPulse = 0;   // pulso extra por cada palabra pronunciada
let ttsEnabled = true;
let queries = 0;

/* ════════════════════════════════════════════════════════════
   ORBE — three.js
   ════════════════════════════════════════════════════════════ */
const canvas = $('#orb');
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
camera.position.set(0, 0, 6.2);

const orb = new THREE.Group();
scene.add(orb);

const NOISE = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const U = {
  uTime:  { value: 0 },
  uAmp:   { value: 0.1 },
  uFreq:  { value: 1.1 },
  uSpeed: { value: 0.3 },
  uColor: { value: new THREE.Color('#2ec8ff') },
  uGlow:  { value: 0.6 },
  uPx:    { value: renderer.getPixelRatio() },
};

/* — nube de partículas con forma de esfera (Fibonacci) — */
const COUNT = 5200;
const pos = new Float32Array(COUNT * 3);
const seed = new Float32Array(COUNT);
for (let i = 0; i < COUNT; i++) {
  const y = 1 - (i / (COUNT - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const th = Math.PI * (3 - Math.sqrt(5)) * i;
  pos[i * 3]     = Math.cos(th) * r;
  pos[i * 3 + 1] = y;
  pos[i * 3 + 2] = Math.sin(th) * r;
  seed[i] = Math.random();
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

const pMat = new THREE.ShaderMaterial({
  uniforms: U,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uTime, uAmp, uFreq, uSpeed, uPx;
    attribute float aSeed;
    varying float vN; varying float vSeed; varying float vDepth;
    ${NOISE}
    void main(){
      vec3 n = normalize(position);
      float d = snoise(n * uFreq * 1.6 + vec3(0.0, uTime * uSpeed, uTime * uSpeed * 0.6));
      float d2 = snoise(n * uFreq * 3.4 - uTime * uSpeed * 0.8);
      float disp = d * uAmp + d2 * uAmp * 0.25;
      vec3 p = n * (1.25 + disp) ;
      vN = d; vSeed = aSeed;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = clamp((-mv.z - 4.6) / 3.2, 0.0, 1.0);
      gl_PointSize = (1.4 + aSeed * 2.2 + max(d,0.0) * 3.0) * uPx * (6.2 / -mv.z) * 1.7;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uColor; uniform float uGlow;
    varying float vN; varying float vSeed; varying float vDepth;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      float bright = 0.55 + vN * 0.9 + vSeed * 0.25;
      float front = 1.0 - vDepth * 0.65;           // las de atrás, más tenues
      vec3 col = mix(uColor * 0.8, vec3(1.0), clamp(vN * 0.7, 0.0, 0.55));
      gl_FragColor = vec4(col * bright, a * a * front * (0.55 + uGlow * 0.5));
    }`,
});
const points = new THREE.Points(pGeo, pMat);
orb.add(points);

/* — núcleo: esfera suave con borde brillante (fresnel) — */
const coreMat = new THREE.ShaderMaterial({
  uniforms: U,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uTime, uAmp, uFreq, uSpeed;
    varying vec3 vNormal; varying float vN;
    ${NOISE}
    void main(){
      vec3 n = normalize(position);
      float d = snoise(n * uFreq + vec3(uTime * uSpeed * 0.7));
      vN = d;
      vec3 p = n * (0.98 + d * uAmp * 0.9);
      vNormal = normalize(normalMatrix * n);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uColor; uniform float uGlow;
    varying vec3 vNormal; varying float vN;
    void main(){
      float f = pow(1.0 - max(dot(normalize(vNormal), vec3(0.0,0.0,1.0)), 0.0), 2.4);
      vec3 col = uColor * (0.12 + f * 1.5 + vN * 0.18);
      gl_FragColor = vec4(col, (0.16 + f * 0.7) * uGlow);
    }`,
});
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 28), coreMat);
orb.add(core);

/* — luz interior — */
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.25, 'rgba(255,255,255,.35)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const glowMat = new THREE.SpriteMaterial({ map: makeGlowTexture(), color: 0x2ec8ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.5 });
const glow = new THREE.Sprite(glowMat);
glow.scale.setScalar(4.2);
orb.add(glow);

/* — anillos orbitales — */
const rings = [];
const ringCfg = [
  { r: 1.62, tube: 0.006, tilt: [1.2, 0.2, 0],   axis: [0.0, 1, 0.2], op: 0.55 },
  { r: 1.82, tube: 0.004, tilt: [0.4, 0.9, 0.3], axis: [1, 0.2, 0],   op: 0.40 },
  { r: 2.05, tube: 0.003, tilt: [-0.6, 0.2, 1],  axis: [0.3, 1, 0.5], op: 0.28 },
];
const ringMat = new THREE.MeshBasicMaterial({ color: 0x2ec8ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
ringCfg.forEach((c, i) => {
  const m = ringMat.clone(); m.opacity = c.op;
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(c.r, c.tube, 8, 220), m);
  mesh.rotation.set(...c.tilt);
  mesh.userData = { ...c, axis: new THREE.Vector3(...c.axis).normalize(), dir: i % 2 ? -1 : 1 };
  orb.add(mesh); rings.push(mesh);

  // pequeño "satélite" sobre cada anillo
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.028 + i * 0.004, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  dot.position.set(c.r, 0, 0);
  mesh.add(dot);
  mesh.userData.dot = dot;
});

/* — tamaño — */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // el orbe se ve entero tanto en pantallas anchas como estrechas
  camera.position.z = w / h < 0.9 ? 8.2 : 6.2;
  // centro visual del orbe: 44 % desde arriba
  camera.setViewOffset(w, h, 0, (0.5 - 0.44) * h, w, h);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ───────── bucle de animación ───────── */
const cur = { amp: .1, freq: 1.1, speed: .3, ring: .25, spin: .06, size: 1, glow: .55 };
const tmpColor = new THREE.Color();
const clock = new THREE.Clock();
let t = 0, ringPhase = 0;

function pseudoVoice(time) {
  // envolvente tipo habla: sílabas rápidas + frases con pausas
  const syl = Math.abs(Math.sin(time * 9.0) * Math.sin(time * 5.3 + 1.0));
  const phrase = 0.55 + 0.45 * Math.sin(time * 1.7);
  const mix = syl * 0.7 + Math.abs(Math.sin(time * 14.3)) * 0.3;
  return Math.min(1, mix * phrase);
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  const T = STATES[state];
  const k = 1 - Math.exp(-dt * 3.2);

  // nivel dinámico según estado
  let dyn = 0;
  if (state === 'listening') dyn = micLevel * 0.34;
  else if (state === 'speaking') { voiceEnv = lerp(voiceEnv, pseudoVoice(t) + boundaryPulse, 1 - Math.exp(-dt * 14)); dyn = voiceEnv * 0.34; }
  else if (state === 'thinking') dyn = (Math.sin(t * 3) * 0.5 + 0.5) * 0.07;
  else dyn = (Math.sin(t * 0.9) * 0.5 + 0.5) * 0.03;   // respiración
  boundaryPulse *= Math.exp(-dt * 7);

  cur.amp   = lerp(cur.amp,   T.amp + dyn, 1 - Math.exp(-dt * (state === 'speaking' || state === 'listening' ? 12 : 3.2)));
  cur.freq  = lerp(cur.freq,  T.freq,  k);
  cur.speed = lerp(cur.speed, T.speed, k);
  cur.ring  = lerp(cur.ring,  T.ring,  k);
  cur.spin  = lerp(cur.spin,  T.spin,  k);
  cur.size  = lerp(cur.size,  T.size + dyn * 0.35, 1 - Math.exp(-dt * 8));
  cur.glow  = lerp(cur.glow,  T.glow + dyn,  k);

  tmpColor.set(T.color);
  U.uColor.value.lerp(tmpColor, k);
  glowMat.color.copy(U.uColor.value);
  rings.forEach(r => r.material.color.copy(U.uColor.value));

  U.uTime.value = t;
  U.uAmp.value = cur.amp;
  U.uFreq.value = cur.freq;
  U.uSpeed.value = cur.speed;
  U.uGlow.value = cur.glow;

  orb.scale.setScalar(cur.size);
  points.rotation.y += dt * cur.spin;
  points.rotation.x = Math.sin(t * 0.2) * 0.15;

  ringPhase += dt * cur.ring;
  rings.forEach((r) => {
    const ud = r.userData;
    r.rotateOnAxis(ud.axis, dt * cur.ring * 0.6 * ud.dir);
    ud.dot.position.set(Math.cos(ringPhase * (1.4 + ud.r * 0.3) * ud.dir) * ud.r, Math.sin(ringPhase * (1.4 + ud.r * 0.3) * ud.dir) * ud.r, 0);
    r.material.opacity = ud.op * (0.7 + cur.glow * 0.5);
  });
  const s = 1 + (state === 'speaking' ? voiceEnv * 0.05 : 0) + (state === 'listening' ? micLevel * 0.06 : 0);
  rings.forEach(r => r.scale.setScalar(s));

  glow.scale.setScalar(3.6 + cur.glow * 1.2 + dyn * 3);
  glowMat.opacity = 0.28 + cur.glow * 0.22;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ════════════════════════════════════════════════════════════
   INTERFAZ — anime.js
   ════════════════════════════════════════════════════════════ */
const procEls = {};
document.querySelectorAll('#proc li').forEach(li => { procEls[li.dataset.p] = li; });
const eqTokens = new WeakMap();

function runEq(li) {
  const bars = li.querySelectorAll('.eq i');
  const token = {}; eqTokens.set(li, token);
  const step = () => {
    if (eqTokens.get(li) !== token) return;
    anime({
      targets: bars,
      height: () => anime.random(18, 100) + '%',
      duration: 240,
      easing: 'easeInOutSine',
      complete: step,
    });
  };
  step();
}
function stopEq(li) {
  eqTokens.set(li, null);
  anime({ targets: li.querySelectorAll('.eq i'), height: '14%', duration: 300, easing: 'easeOutQuad' });
}

function setState(next) {
  if (state === next) return;
  const prev = state;
  state = next;
  const T = STATES[next];

  // color de acento de toda la interfaz
  const c = new THREE.Color(T.color);
  const rgb = `${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)}`;
  const root = document.documentElement.style;
  root.setProperty('--accent', T.color);
  root.setProperty('--accent-rgb', rgb);
  const spin = { idle: [60, 90, 140], listening: [40, 70, 110], thinking: [7, 11, 16], speaking: [26, 40, 60] }[next];
  root.setProperty('--spin1', spin[0] + 's'); root.setProperty('--spin2', spin[1] + 's'); root.setProperty('--spin3', spin[2] + 's');

  // etiqueta bajo el orbe
  const lab = $('#stateLabel');
  if (!reduceMotion) anime({ targets: lab, opacity: [0, 1], translateY: ['-6px', '0px'], duration: 380, easing: 'easeOutCubic' });
  lab.textContent = T.label;

  // barra lateral: solo un proceso activo
  Object.entries(procEls).forEach(([key, li]) => {
    const on = key === next;
    const was = li.classList.contains('active');
    li.classList.toggle('active', on);
    li.querySelector('.sub').textContent = on ? ({ listening: 'Capturando audio…', thinking: 'Procesando la consulta…', speaking: 'Reproduciendo respuesta…' }[key]) : 'Inactivo';
    if (on && !was) {
      runEq(li);
      if (!reduceMotion) anime({ targets: li.querySelector('.ico'), scale: [0.7, 1], duration: 520, easing: 'easeOutElastic(1, .6)' });
    }
    if (!on && was) stopEq(li);
  });

  log(`Estado: ${T.label.toLowerCase()}`);
}

/* ───────── registro ───────── */
const logEl = $('#log');
function log(msg, cls = '') {
  const d = new Date();
  const p = document.createElement('p');
  if (cls) p.className = cls;
  const tm = document.createElement('time'); tm.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  p.appendChild(tm); p.appendChild(document.createTextNode(msg));
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.children.length > 80) logEl.firstChild.remove();
  if (!reduceMotion) anime({ targets: p, opacity: [0, 1], translateX: ['10px', '0px'], duration: 300, easing: 'easeOutQuad' });
}

/* ───────── reloj y tiempo activo ───────── */
const t0 = Date.now();
function tick() {
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('#date').textContent = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const s = Math.floor((Date.now() - t0) / 1000);
  $('#stUp').textContent = s >= 3600 ? `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
}
setInterval(tick, 1000); tick();

/* ════════════════════════════════════════════════════════════
   MICRÓFONO — nivel de audio + reconocimiento de voz
   ════════════════════════════════════════════════════════════ */
const micBtn = $('#micBtn');
const input = $('#input');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recRunning = false;
let stream = null, audioCtx = null, analyser = null, buf = null;

function idleState() { setState(micOn ? 'listening' : 'idle'); }

async function startLevel() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
    src.connect(analyser);
    buf = new Uint8Array(analyser.fftSize);
    readLevel();
    return true;
  } catch (err) {
    log('No se pudo acceder al micrófono: ' + (err.name || err.message), 'e');
    return false;
  }
}
function readLevel() {
  if (!analyser) { micLevel = 0; return; }
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
  const rms = Math.sqrt(sum / buf.length);
  micLevel = lerp(micLevel, Math.min(1, rms * 5), 0.35);
  requestAnimationFrame(readLevel);
}
function stopLevel() {
  analyser = null; micLevel = 0;
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  if (audioCtx) audioCtx.close();
  stream = audioCtx = null;
}

function startRec() {
  if (!SR || recRunning || !micOn || state === 'thinking' || state === 'speaking') return;
  rec = new SR();
  rec.lang = CONFIG.lang;
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { recRunning = true; };
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tr = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += tr; else interim += tr;
    }
    input.value = (finalText + interim).trim();
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { log('El navegador bloqueó el reconocimiento de voz.', 'e'); setMic(false); }
    else if (e.error !== 'no-speech' && e.error !== 'aborted') log('Reconocimiento de voz: ' + e.error, 'w');
  };
  rec.onend = () => {
    recRunning = false;
    const text = finalText.trim();
    if (text && micOn) { send(text); return; }
    if (micOn && state === 'listening') setTimeout(startRec, 250);
  };
  try { rec.start(); } catch (_) { recRunning = false; }
}
function stopRec() {
  if (rec) { rec.onend = null; try { rec.abort(); } catch (_) {} }
  recRunning = false;
}

async function setMic(on) {
  if (on === micOn) return;
  micBtn.classList.toggle('on', on);
  micBtn.setAttribute('aria-pressed', String(on));
  $('#stMic').textContent = on ? 'Encendido' : 'Apagado';
  if (!reduceMotion) anime({ targets: micBtn, scale: [0.82, 1], duration: 450, easing: 'easeOutElastic(1, .6)' });

  if (on) {
    micOn = true;
    const ok = await startLevel();
    if (!ok) { micOn = false; micBtn.classList.remove('on'); micBtn.setAttribute('aria-pressed', 'false'); $('#stMic').textContent = 'Apagado'; return; }
    log('Micrófono encendido');
    if (!SR) log('Este navegador no tiene reconocimiento de voz. Usa Chrome o Edge para dictar; el orbe sí reacciona al sonido.', 'w');
    if (state === 'idle') setState('listening');
    startRec();
  } else {
    micOn = false;
    stopRec(); stopLevel();
    log('Micrófono apagado');
    if (state === 'listening') setState('idle');
  }
}
micBtn.addEventListener('click', () => setMic(!micOn));
addEventListener('keydown', (e) => {
  if ((e.key === 'm' || e.key === 'M') && document.activeElement !== input && !e.ctrlKey && !e.metaKey) setMic(!micOn);
});

/* ════════════════════════════════════════════════════════════
   CONVERSACIÓN
   ════════════════════════════════════════════════════════════ */
const youEl = $('#you'), outEl = $('#jarvisText');
let busy = false;

async function askJarvis(text) {
  if (CONFIG.endpoint) {
    const res = await fetch(CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...CONFIG.headers },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error('El servidor respondió ' + res.status);
    const data = await res.json();
    return data.reply ?? data.response ?? data.text ?? '';
  }
  // modo demostración
  await new Promise(r => setTimeout(r, 1400 + Math.random() * 1200));
  const q = text.toLowerCase();
  if (/hora/.test(q)) return `Son las ${new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}.`;
  if (/fecha|d[ií]a/.test(q)) return `Hoy es ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}.`;
  if (/hola|buenas/.test(q)) return 'Buenos días. Todos los sistemas funcionan con normalidad.';
  return 'Estoy en modo demostración. Cuando configure el endpoint en CONFIG, responderé con su servidor.';
}

function typeOut(el, text) {
  el.textContent = '';
  if (reduceMotion) { el.textContent = text; return; }
  const o = { n: 0 };
  anime({ targets: o, n: text.length, duration: Math.min(4000, text.length * 28), easing: 'linear', update: () => { el.textContent = text.slice(0, Math.round(o.n)); } });
}

function speak(text) {
  return new Promise((resolve) => {
    setState('speaking');
    typeOut(outEl, text);
    if (!ttsEnabled || !('speechSynthesis' in window)) {
      setTimeout(resolve, Math.max(1800, text.length * 55));
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = CONFIG.lang; u.rate = CONFIG.voiceRate; u.pitch = CONFIG.voicePitch;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (v) u.voice = v;
    u.onboundary = () => { boundaryPulse = Math.min(1, boundaryPulse + 0.5); };
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  queries++; $('#stQ').textContent = queries;
  input.value = '';
  youEl.textContent = text;
  outEl.textContent = '';
  log('Usted: ' + text, 'u');

  stopRec();
  setState('thinking');
  const started = performance.now();
  try {
    const reply = await askJarvis(text);
    $('#stLat').textContent = ((performance.now() - started) / 1000).toFixed(1) + ' s';
    log('Respuesta recibida');
    await speak(reply || 'No he recibido contenido en la respuesta.');
  } catch (err) {
    log('Error: ' + err.message, 'e');
    outEl.textContent = 'No he podido contactar con el servidor. Revise la dirección en CONFIG.';
    setState('idle');
    await new Promise(r => setTimeout(r, 400));
  }
  busy = false;
  idleState();
  if (micOn) startRec();
}

$('#composer').addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });

const ttsSwitch = $('#ttsSwitch');
ttsSwitch.addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  ttsSwitch.setAttribute('aria-checked', String(ttsEnabled));
  if (!ttsEnabled) speechSynthesis.cancel();
  log('Respuesta por voz ' + (ttsEnabled ? 'activada' : 'desactivada'));
});
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ───────── secuencia de arranque ───────── */
if (!reduceMotion) {
  anime.set(['.top', '.side', '.composer', '.readout'], { opacity: 0 });
  anime.timeline({ easing: 'easeOutCubic' })
    .add({ targets: '.top', opacity: [0, 1], duration: 700 }, 200)
    .add({ targets: '.side', opacity: [0, 1], translateX: ['24px', '0px'], duration: 800 }, 350)
    .add({ targets: '.proc li', opacity: [0, 1], translateX: ['16px', '0px'], delay: anime.stagger(110), duration: 500 }, 700)
    .add({ targets: '.readout', opacity: [0, 1], duration: 600 }, 900)
    .add({ targets: '.composer', opacity: [0, 1], translateY: ['18px', '0px'], duration: 700 }, 1000);
  // el orbe "despierta" con una expansión inicial
  cur.size = 0.2; cur.amp = 0.5;
}

setState('idle');
log('Sistema iniciado');
log(CONFIG.endpoint ? 'Servidor: ' + CONFIG.endpoint : 'Sin endpoint configurado: modo demostración', CONFIG.endpoint ? '' : 'w');
</script>
</body>
</html>
