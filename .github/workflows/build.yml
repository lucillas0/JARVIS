# Compila JARVIS para Windows, Linux y macOS, y publica una release.
#
# Cada SO se compila en su propio runner: un .dmg para macOS no se puede
# generar desde Windows, y un AppImage necesita el toolchain de Linux. El
# nombre de la Release trae la arquitectura para no liar los ficheros.
#
# Dos cosas que costaron sangre y conviene no volver a romper:
#
#   - La app esta en JARVIS/app, no en app. Todo npm va con ese prefijo.
#   - Los iconos se generan en cada job, porque cada job hace su propio
#     checkout y lo que genere otro job no lo tiene.
#
# El paso de compilar publica el error real como anotacion cuando falla, para
# poder saber que pasa sin tener que abrir el log entero.

name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python -m pip install --quiet pillow
      # Las ruedas viajan dentro del instalador para que al abrir JARVIS no
      # haya que descargar nada: se instala en segundos y sin internet.
      - name: Descargar las dependencias para esta plataforma
        run: |
          rm -rf JARVIS/dist-assets/wheelhouse
          mkdir -p JARVIS/dist-assets/wheelhouse
          python -m pip download --dest JARVIS/dist-assets/wheelhouse \
            -r JARVIS/brain/requirements.txt
          ls JARVIS/dist-assets/wheelhouse | wc -l
      - run: npm --prefix JARVIS/app run iconos
      - run: npm ci --prefix JARVIS/app
      - name: Compilar
        run: |
          set +e
          npm --prefix JARVIS/app run dist:win 2>&1 | tee build.log
          codigo=${PIPESTATUS[0]}
          if [ $codigo -ne 0 ]; then
            echo "::error::sale con codigo $codigo. Ultimas lineas del log:"
            tail -25 build.log | tr -d '\r' | cut -c1-200 |
              while IFS= read -r linea; do echo "::error::$linea"; done
          fi
          exit $codigo
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: JARVIS/dist-installer/*.exe

  linux:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 libssl3 rpm build-essential python3-dev
      - run: python -m pip install --quiet pillow
      - run: python -m pip install --quiet pillow
      # Las ruedas viajan dentro del instalador para que al abrir JARVIS no
      # haya que descargar nada: se instala en segundos y sin internet.
      - name: Descargar las dependencias para esta plataforma
        run: |
          rm -rf JARVIS/dist-assets/wheelhouse
          mkdir -p JARVIS/dist-assets/wheelhouse
          python -m pip download --dest JARVIS/dist-assets/wheelhouse \
            -r JARVIS/brain/requirements-desktop.txt
          ls JARVIS/dist-assets/wheelhouse | wc -l
      - run: npm --prefix JARVIS/app run iconos
      - run: npm ci --prefix JARVIS/app
      - name: Compilar
        run: |
          set +e
          npm --prefix JARVIS/app run dist:linux 2>&1 | tee build.log
          codigo=${PIPESTATUS[0]}
          if [ $codigo -ne 0 ]; then
            echo "::error::sale con codigo $codigo. Ultimas lineas del log:"
            tail -25 build.log | tr -d '\r' | cut -c1-200 |
              while IFS= read -r linea; do echo "::error::$linea"; done
          fi
          exit $codigo
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux-x64
          path: |
            JARVIS/dist-installer/*.AppImage
            JARVIS/dist-installer/*.deb
            JARVIS/dist-installer/*.rpm
            JARVIS/dist-installer/*.tar.gz

  linux-arm:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 libssl3 rpm build-essential python3-dev
      - run: python -m pip install --quiet pillow
      - run: python -m pip install --quiet pillow
      # Las ruedas viajan dentro del instalador para que al abrir JARVIS no
      # haya que descargar nada: se instala en segundos y sin internet.
      - name: Descargar las dependencias para esta plataforma
        run: |
          rm -rf JARVIS/dist-assets/wheelhouse
          mkdir -p JARVIS/dist-assets/wheelhouse
          python -m pip download --dest JARVIS/dist-assets/wheelhouse \
            -r JARVIS/brain/requirements-desktop.txt
          ls JARVIS/dist-assets/wheelhouse | wc -l
      - run: npm --prefix JARVIS/app run iconos
      - run: npm ci --prefix JARVIS/app
      - name: Compilar
        run: |
          set +e
          npm --prefix JARVIS/app run dist:linux:arm 2>&1 | tee build.log
          codigo=${PIPESTATUS[0]}
          if [ $codigo -ne 0 ]; then
            echo "::error::sale con codigo $codigo. Ultimas lineas del log:"
            tail -25 build.log | tr -d '\r' | cut -c1-200 |
              while IFS= read -r linea; do echo "::error::$linea"; done
          fi
          exit $codigo
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux-arm64
          path: |
            JARVIS/dist-installer/*.AppImage
            JARVIS/dist-installer/*.deb
            JARVIS/dist-installer/*.rpm
            JARVIS/dist-installer/*.tar.gz

  macos-arm:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python -m pip install --quiet pillow
      # Las ruedas viajan dentro del instalador para que al abrir JARVIS no
      # haya que descargar nada: se instala en segundos y sin internet.
      - name: Descargar las dependencias para esta plataforma
        run: |
          rm -rf JARVIS/dist-assets/wheelhouse
          mkdir -p JARVIS/dist-assets/wheelhouse
          python -m pip download --dest JARVIS/dist-assets/wheelhouse \
            -r JARVIS/brain/requirements-desktop.txt
          ls JARVIS/dist-assets/wheelhouse | wc -l
      - run: npm --prefix JARVIS/app run iconos
      - run: npm ci --prefix JARVIS/app
      - name: Compilar
        run: |
          npm --prefix JARVIS/app run dist:mac:arm 2>&1 | tee build.log
          codigo=${PIPESTATUS[0]}
          if [ $codigo -ne 0 ]; then
            grep -iE 'error|cannot find|not found|unable|failed' build.log | tail -12 |
              while IFS= read -r linea; do echo "::error::$linea"; done
          fi
          exit $codigo
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos-arm64
          path: JARVIS/dist-installer/*.dmg

  macos-intel:
    name: macOS (Intel)
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python -m pip install --quiet pillow
      # Las ruedas viajan dentro del instalador para que al abrir JARVIS no
      # haya que descargar nada: se instala en segundos y sin internet.
      - name: Descargar las dependencias para esta plataforma
        run: |
          rm -rf JARVIS/dist-assets/wheelhouse
          mkdir -p JARVIS/dist-assets/wheelhouse
          python -m pip download --dest JARVIS/dist-assets/wheelhouse \
            -r JARVIS/brain/requirements-desktop.txt
          ls JARVIS/dist-assets/wheelhouse | wc -l
      - run: npm --prefix JARVIS/app run iconos
      - run: npm ci --prefix JARVIS/app
      - name: Compilar
        run: |
          npm --prefix JARVIS/app run dist:mac 2>&1 | tee build.log
          codigo=${PIPESTATUS[0]}
          if [ $codigo -ne 0 ]; then
            grep -iE 'error|cannot find|not found|unable|failed' build.log | tail -12 |
              while IFS= read -r linea; do echo "::error::$linea"; done
          fi
          exit $codigo
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos-x64
          path: JARVIS/dist-installer/*.dmg

  release:
    name: Publicar release
    needs: [windows, linux, linux-arm, macos-arm, macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Sin esto no hay ficheros en disco: este job no compila, pero necesita
      # leer el .yml y el .env de ejemplo para publicarlos.
      - uses: actions/checkout@v4
      # El .yml y el .env de ejemplo se publican sueltos: quien monta el
      # servidor en un NAS no descarga el instalador de escritorio.
      - name: Recoger los ficheros del modo servidor
        run: |
          mkdir -p servidor
          cp JARVIS/docker-compose.yml servidor/
          cp JARVIS/configuracion.env.example servidor/
          cp JARVIS/DOCKER.md servidor/
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - name: Listar los ficheros
        run: ls -la artefactos servidor
      # electron-builder nombra los ficheros como electron-builder-XX-4.1.0-win-x64.exe,
      # con la arquitectura en medio y abreviaturas raras (x86_64, amd64). Para quien
      # descarga, el nombre tiene que decir que sistema es y que version es, asi que
      # se renombran aqui, que es donde ya estan todos juntos.
      - name: Poner nombres que se entiendan
        run: |
          VERSION=$(node -p "require('./JARVIS/app/package.json').version")
          cd artefactos
          mover() { if [ -f "$1" ]; then mv -v "$1" "$2"; fi; }
          mover "JARVIS-${VERSION}-win-x64.exe"     "Windows-${VERSION}.exe"
          mover "JARVIS-${VERSION}-x86_64.AppImage" "Linux-${VERSION}.AppImage"
          mover "JARVIS-${VERSION}-amd64.deb"       "Linux-${VERSION}.deb"
          mover "JARVIS-${VERSION}-x86_64.rpm"      "Linux-${VERSION}.rpm"
          mover "JARVIS-${VERSION}-x64.tar.gz"      "Linux-${VERSION}.tar.gz"
          mover "JARVIS-${VERSION}-arm64.AppImage"  "Linux-arm64-${VERSION}.AppImage"
          mover "JARVIS-${VERSION}-arm64.tar.gz"    "Linux-arm64-${VERSION}.tar.gz"
          mover "JARVIS-${VERSION}-mac-x64.dmg"     "Mac-Intel-${VERSION}.dmg"
          mover "JARVIS-${VERSION}-mac-arm64.dmg"   "Mac-Silicon-${VERSION}.dmg"
          ls -la
      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          name: JARVIS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artefactos/*.exe
            artefactos/*.AppImage
            artefactos/*.deb
            artefactos/*.rpm
            artefactos/*.tar.gz
            artefactos/*.dmg
            servidor/docker-compose.yml
            servidor/configuracion.env.example
            servidor/DOCKER.md